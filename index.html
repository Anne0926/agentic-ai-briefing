<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Intelligence | Daily Briefing</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--border:#30363d;--accent:#58a6ff;--green:#3fb950;--text:#e6edf3;--muted:#8b949e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.logo{font-size:2.5rem;font-weight:900;margin-bottom:8px}
.logo span{color:var(--accent)}
.tagline{color:var(--muted);margin-bottom:48px;font-size:1rem}
.date{font-size:0.9rem;color:var(--muted);margin-bottom:32px}
.cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px 40px;text-align:center;text-decoration:none;transition:all 0.2s;min-width:220px}
.card:hover{border-color:var(--accent);transform:translateY(-3px)}
.card-icon{font-size:3rem;margin-bottom:16px}
.card-title{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:8px}
.card-sub{font-size:0.85rem;color:var(--muted)}
.card-count{margin-top:12px;font-size:0.8rem;padding:4px 12px;border-radius:20px;display:inline-block}
.cnt-consulting{background:#1f3a6e;color:var(--accent)}
.cnt-news{background:#1f3a2e;color:var(--green)}
.footer{margin-top:48px;color:var(--muted);font-size:0.78rem}
</style>
</head>
<body>
<div class="logo">🤖 SK <span>Intelligence</span></div>
<p class="tagline">전략기획 임원을 위한 데일리 AI·기술 인텔리전스</p>
<p class="date">최종 업데이트: 2026년 5월 11일 (월)</p>
<div class="cards">
  <a href="consulting.html" class="card">
    <div class="card-icon">📊</div>
    <div class="card-title">Consulting Briefing</div>
    <div class="card-sub">McKinsey · BCG · Deloitte · Gartner</div>
    <span class="card-count cnt-consulting">오늘 6건</span>
  </a>
  <a href="news.html" class="card">
    <div class="card-icon">📰</div>
    <div class="card-title">News Scrap</div>
    <div class="card-sub">TechCrunch · VentureBeat · 전자신문</div>
    <span class="card-count cnt-news">오늘 6건</span>
  </a>
</div>
<p class="footer">© 2026 SK Intelligence | Powered by Agentic AI Daily Briefing</p>
</body>
</html>
